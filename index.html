<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hear. Say. Shine!</title>
  <style>
    :root {
      --primary-color: #4A90E2;
      --accent-color: #FFB300;
      --bg-color: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-main: #2D3748;
      --text-muted: #718096;
      --success: #38A169;
      --danger: #E53E3E;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
    }

    body { 
      background-color: var(--bg-color); 
      color: var(--text-main); 
      min-height: 100vh; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
    }

    .app-container {
      width: 100%;
      max-width: 820px;
      min-height: 90vh;
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      margin: 20px;
      padding: 30px;
    }

    /* 頁面切換控制 */
    .view-screen { 
      display: none; 
      flex-direction: column; 
      width: 100%; 
      height: 100%; 
      flex: 1; 
      align-items: center; 
    }
    .view-screen.active { 
      display: flex; 
    }
    #screen-cover {
      justify-content: space-between;
      padding: 40px 0 20px 0;
    }

    /* 弧形標題設計 */
    .curved-header { 
      text-align: center; 
      margin-bottom: 25px; 
      position: relative; 
      width: 100%; 
    }
    .curved-header h1 {
      font-size: 2.2rem;
      letter-spacing: 2px;
      color: #1A365D;
      display: inline-block;
      position: relative;
      padding: 0 25px;
    }
    .curved-header h1::before {
      content: "(";
      position: absolute;
      left: 0;
      font-weight: 300;
      color: var(--text-muted);
    }
    .curved-header h1::after {
      content: ")";
      position: absolute;
      right: 0;
      font-weight: 300;
      color: var(--text-muted);
    }
    .header-curve-line {
      width: 220px;
      height: 14px;
      border: solid 2.5px #A0AEC0;
      border-color: #A0AEC0 transparent transparent transparent;
      border-radius: 50%/12px 12px 0 0;
      margin: -6px auto 10px auto;
    }

    /* 扉頁：五本書彩虹拱形排版 */
    .books-container {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 14px;
      margin: 40px auto 40px auto; /* 加上固定的上下距離，視覺重心會往上提 */
      width: 100%;
      height: 220px;
      padding-bottom: 20px;
}

    .book-cover {
      width: 110px;
      height: 155px;
      border-radius: 8px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.15);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      cursor: pointer;
      object-fit: cover;
      background-color: #fff;
    }

    /* 拱形角度與位移設定 (中間高、兩側下沉微旋轉) */
    .book-cover:nth-child(1) {
      transform: translateY(22px) rotate(-14deg);
    }
    .book-cover:nth-child(2) {
      transform: translateY(6px) rotate(-7deg);
    }
    .book-cover:nth-child(3) {
      transform: translateY(-8px) rotate(0deg);
      z-index: 2;
    }
    .book-cover:nth-child(4) {
      transform: translateY(6px) rotate(7deg);
    }
    .book-cover:nth-child(5) {
      transform: translateY(22px) rotate(14deg);
    }

    /* 滑鼠懸停浮起放大效果 */
    .book-cover:hover {
      transform: translateY(-16px) scale(1.12) rotate(0deg) !important;
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.25);
      z-index: 10;
    }

    /* 開始按鈕 */
    .btn-start {
      margin-top: 0;
      margin-bottom: 20px;
      padding: 12px 50px;
      font-size: 1.25rem;
      font-weight: bold;
      color: #2D3748;
      background: #FFF;
      border: 2.5px solid #2D3748;
      border-radius: 35px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    .btn-start:hover { 
      background: #2D3748; 
      color: #FFF; 
      transform: translateY(-2px); 
    }

    /* 主題目錄 (3x3 圓圈) */
    .theme-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px 20px;
      width: 100%;
      max-width: 650px;
      margin: 20px auto;
    }
    .circle-theme-btn {
      width: 110px;
      height: 110px;
      margin: 0 auto;
      border-radius: 50%;
      border: 2.5px solid #2D3748;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.8rem;
      font-weight: 600;
      color: #2D3748;
    }
    .circle-theme-btn span.theme-number { 
      font-size: 1.1rem; 
      font-weight: bold; 
      margin-bottom: 2px; 
    }
    .circle-theme-btn:hover { 
      background: #EDF2F7; 
      transform: scale(1.05); 
    }

    /* 答題介面樣式 */
    .nav-bar { 
      width: 100%; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 15px; 
    }
    .back-btn { 
      border: none; 
      background: transparent; 
      font-size: 1rem; 
      color: var(--primary-color); 
      cursor: pointer; 
      font-weight: bold; 
    }
    
    .scope-box {
      width: 100%;
      background: #EBF8FF;
      border-left: 5px solid var(--primary-color);
      border-radius: 6px;
      padding: 12px 18px;
      margin-bottom: 20px;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .scope-title { 
      font-weight: bold; 
      color: #2B6CB0; 
      margin-bottom: 4px; 
    }
    .scope-detail { 
      color: #4A5568; 
      font-size: 0.88rem; 
      white-space: pre-line; 
    }

    .part-tabs { 
      display: flex; 
      gap: 10px; 
      width: 100%; 
      margin-bottom: 20px; 
      border-bottom: 2px solid #EDF2F7; 
      padding-bottom: 8px; 
    }
    .tab-btn { 
      background: none; 
      border: none; 
      font-size: 1rem; 
      padding: 6px 14px; 
      cursor: pointer; 
      border-radius: 6px; 
      color: var(--text-muted); 
      font-weight: 600; 
    }
    .tab-btn.active { 
      background: var(--primary-color); 
      color: #FFF; 
    }

    .quiz-body { 
      width: 100%; 
      flex: 1; 
      overflow-y: auto; 
      padding-right: 5px; 
    }
    .question-card { 
      background: #FFF; 
      border: 1px solid #E2E8F0; 
      border-radius: 10px; 
      padding: 15px 18px; 
      margin-bottom: 15px; 
    }
    .question-header { 
      font-weight: 600; 
      margin-bottom: 10px; 
      display: flex; 
      align-items: center; 
      gap: 8px; 
    }
    .options-group { 
      display: flex; 
      gap: 10px; 
      flex-wrap: wrap; 
      margin-top: 8px; 
    }
    .option-btn { 
      border: 1.5px solid #CBD5E0; 
      background: #FFF; 
      border-radius: 6px; 
      padding: 6px 16px; 
      cursor: pointer; 
      font-size: 0.95rem; 
      transition: 0.2s; 
    }
    .option-btn:hover { 
      border-color: var(--primary-color); 
    }
    .option-btn.correct { 
      background: var(--success); 
      color: #FFF; 
      border-color: var(--success); 
    }
    .option-btn.wrong { 
      background: var(--danger); 
      color: #FFF; 
      border-color: var(--danger); 
    }

    .input-fill { 
      padding: 6px 10px; 
      border: 1.5px solid #CBD5E0; 
      border-radius: 6px; 
      font-size: 1rem; 
      width: 90px; 
      text-align: center; 
    }
    .btn-audio { 
      background: #EDF2F7; 
      border: 1px solid #CBD5E0; 
      border-radius: 50%; 
      width: 34px; 
      height: 34px; 
      display: inline-flex; 
      align-items: center; 
      justify-content: center; 
      cursor: pointer; 
    }
    .loading-text { 
      font-size: 1.1rem; 
      color: var(--text-muted); 
      text-align: center; 
      margin-top: 40px; 
    }
  </style>
</head>
<body>

<div class="app-container">

  <!-- 1. 扉頁 (首頁) -->
  <section id="screen-cover" class="view-screen active">
    <div class="curved-header">
      <h1>Hear. Say. Shine!</h1>
      <div class="header-curve-line"></div>
    </div>

    <!-- 五本書彩虹拱形展示區 (PNG格式) -->
    <div class="books-container">
      <img src="./images/Phonics Fun 1.png" alt="Phonics Fun 1" class="book-cover">
      <img src="./images/Phonics Fun 2.png" alt="Phonics Fun 2" class="book-cover">
      <img src="./images/Phonics Fun 3.png" alt="Phonics Fun 3" class="book-cover">
      <img src="./images/Phonics GO 1.png" alt="Phonics GO 1" class="book-cover">
      <img src="./images/Phonics GO 2.png" alt="Phonics GO 2" class="book-cover">
    </div>

    <button class="btn-start" onclick="navigateTo('screen-menu')">START</button>
  </section>

  <!-- 2. 主題選單頁 (9大主題 3x3 圓圈) -->
  <section id="screen-menu" class="view-screen">
    <div class="curved-header">
      <h1>Hear. Say. Shine!</h1>
      <div class="header-curve-line"></div>
    </div>

    <div class="theme-grid" id="themeGrid"></div>

    <button class="back-btn" style="margin-top: auto;" onclick="navigateTo('screen-cover')">← 回到主頁</button>
  </section>

  <!-- 3. 測驗進行頁 -->
  <section id="screen-quiz" class="view-screen">
    <div class="nav-bar">
      <button class="back-btn" onclick="navigateTo('screen-menu')">← 回主題目錄</button>
      <span id="currentThemeTag" style="font-weight: bold; color: var(--text-muted);"></span>
    </div>

    <!-- 適用範圍提示框 (圖二資訊) -->
    <div class="scope-box" id="scopeContainer">
      <div class="scope-title" id="scopeTitle">適用主題</div>
      <div class="scope-detail" id="scopeDetail">題目範圍載入中...</div>
    </div>

    <!-- Part 頁籤 -->
    <div class="part-tabs">
      <button class="tab-btn active" onclick="switchPart('partA', this)">Part A</button>
      <button class="tab-btn" onclick="switchPart('partB', this)">Part B</button>
      <button class="tab-btn" onclick="switchPart('partC', this)">Part C</button>
    </div>

    <!-- 題目容器 -->
    <div class="quiz-body" id="questionsContainer"></div>
  </section>

</div>

<script>
  // 9 大主題配置
  const themeList = [
    { id: 1, file: "theme01.json", name: "Alphabets & Sounds", fullTheme: "Alphabets and Letter Sounds", scope: "26個字母\nPhonics FUN Book 1 U1-10\nPhonics GO Book 1 U1-8" },
    { id: 2, file: "theme02.json", name: "Short Vowels", fullTheme: "Short Vowels", scope: "Short Vowels (a, e, i, o, u)\nPhonics FUN Book 1 U13-17\nPhonics GO Book 1 U9-13" },
    { id: 3, file: "theme03.json", name: "Long Vowels", fullTheme: "Long Vowels", scope: "Long Vowels\nPhonics FUN Book 1 U18-19, Book 2 U1-10\nPhonics GO Book 1 U18-19, Book 2 U1-5" },
    { id: 4, file: "theme04.json", name: "More Vowels", fullTheme: "More Vowels", scope: "Diphthongs: oi, oy, ou, ow, oo\nVowel Digraphs: au, aw, al\nGlued Sounds: oll, ull\nPhonics FUN Book 2 U12-14\nPhonics GO Book 2 U12-15" },
    { id: 5, file: "theme05.json", name: "R-Controlled", fullTheme: "R-Controlled Vowels", scope: "ar, or, war, wor, ir, er, ur\nPhonics FUN Book 2 U15-16\nPhonics GO Book 2 U10-11" },
    { id: 6, file: "theme06.json", name: "Blends", fullTheme: "L, R, S Blends", scope: "Blends\nPhonics FUN Book 2 U17, Book 3 U11-12, 15\nPhonics GO Book 1 U14-17" },
    { id: 7, file: "theme07.json", name: "Digraphs", fullTheme: "Consonant Digraphs", scope: "sh, ch, tch, th, gh, wh, ph\nPhonics FUN Book 2 U18-19, Book 3 U7-8\nPhonics GO Book 2 U6-9" },
    { id: 8, file: "theme08.json", name: "Special Consonants", fullTheme: "Special Consonants", scope: "Special Consonants (ck, kn, wr, -mb, -mn, -nd...)\nPhonics FUN Book 3 U8, 9, 13-16\nPhonics GO Book 2 U16-19" },
    { id: 9, file: "theme09.json", name: "Endings & Stress", fullTheme: "Endings, Syllables, Stress", scope: "-s/-es, -ed, 1~3 syllables\nPhonics FUN Book 3 U17-19" }
  ];

  let currentThemeMeta = null;
  let currentThemeData = null;
  let currentPart = 'partA';

  function navigateTo(screenId) {
    document.querySelectorAll('.view-screen').forEach(el => el.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }

  function initThemeGrid() {
    const grid = document.getElementById('themeGrid');
    grid.innerHTML = themeList.map(item => `
      <div class="circle-theme-btn" onclick="loadAndOpenTheme(${item.id})">
        <span class="theme-number">U${item.id}</span>
        <span>${item.name}</span>
      </div>
    `).join('');
  }

  async function loadAndOpenTheme(themeId) {
    currentThemeMeta = themeList.find(t => t.id === themeId);
    document.getElementById('currentThemeTag').innerText = `主題 ${currentThemeMeta.id}`;
    
    document.getElementById('scopeTitle').innerText = `適用主題：${currentThemeMeta.fullTheme}`;
    document.getElementById('scopeDetail').innerText = currentThemeMeta.scope;
    
    const container = document.getElementById('questionsContainer');
    container.innerHTML = `<div class="loading-text">正在載入 ${currentThemeMeta.file}...</div>`;
    navigateTo('screen-quiz');

    try {
      const response = await fetch(`./${currentThemeMeta.file}`);
      if (!response.ok) throw new Error('檔案讀取失敗');
      currentThemeData = await response.json();
      switchPart('partA', document.querySelector('.tab-btn'));
    } catch (err) {
      container.innerHTML = `<div class="loading-text" style="color:var(--danger)">載入 ${currentThemeMeta.file} 失敗，請確認檔案是否存在於倉庫根目錄。</div>`;
      console.error(err);
    }
  }

  function switchPart(partKey, btn) {
    currentPart = partKey;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    if(btn) btn.classList.add('active');
    renderQuestions();
  }

  function playAudio(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.85;
      window.speechSynthesis.speak(utterance);
    }
  }

  function renderQuestions() {
    if (!currentThemeData) return;
    const container = document.getElementById('questionsContainer');
    const questions = currentThemeData[currentPart] || [];

    if (questions.length === 0) {
      container.innerHTML = `<p style="color:#A0AEC0; text-align:center; padding:30px;">該大題無題目</p>`;
      return;
    }

    if (currentPart === 'partA') {
      container.innerHTML = questions.map((q, idx) => `
        <div class="question-card">
          <div class="question-header">
            ${idx + 1}. ${q.question || '請選出正確發音或選項'}
            ${q.audioScript ? `<button class="btn-audio" onclick="playAudio('${q.audioScript}')">🔊</button>` : ''}
          </div>
          <div class="options-group">
            ${q.options.map(opt => `
              <button class="option-btn" onclick="checkChoice(this, '${opt}', '${q.answer}')">${opt}</button>
            `).join('')}
          </div>
        </div>
      `).join('');
    } else if (currentPart === 'partB') {
      container.innerHTML = questions.map((q, idx) => `
        <div class="question-card">
          <div class="question-header">
            ${idx + 1}. ${q.prompt} 
            ${q.hint ? `<span style="color:#718096; font-size:0.9rem;">(${q.hint})</span>` : ''}
          </div>
          <div style="display:flex; gap:10px; align-items:center;">
            <input type="text" class="input-fill" placeholder="填寫字母" id="fill_${idx}">
            <button class="option-btn" onclick="checkFill(${idx}, '${q.answer}')">檢查</button>
            <span id="fill_res_${idx}" style="font-weight:bold; font-size:0.9rem;"></span>
          </div>
        </div>
      `).join('');
    } else if (currentPart === 'partC') {
      container.innerHTML = questions.map((q, idx) => `
        <div class="question-card">
          <div class="question-header">
            ${idx + 1}. 仔細聽發音並選出正確單字：
            ${q.audioScript ? `<button class="btn-audio" onclick="playAudio('${q.audioScript}')">🔊</button>` : ''}
          </div>
          <div class="options-group">
            ${q.options.map(opt => `
              <button class="option-btn" onclick="checkChoice(this, '${opt}', '${q.answer}')">${opt}</button>
            `).join('')}
          </div>
        </div>
      `).join('');
    }
  }

  function checkChoice(btn, selected, correct) {
    const parent = btn.parentElement;
    parent.querySelectorAll('.option-btn').forEach(b => b.classList.remove('correct', 'wrong'));
    if (selected === correct) {
      btn.classList.add('correct');
    } else {
      btn.classList.add('wrong');
    }
  }

  function checkFill(idx, correct) {
    const input = document.getElementById(`fill_${idx}`);
    const res = document.getElementById(`fill_res_${idx}`);
    const val = input.value.trim().toLowerCase();
    const expected = correct.trim().toLowerCase();
    if (val === expected) {
      res.style.color = 'var(--success)';
      res.innerText = '✓ 正確';
    } else {
      res.style.color = 'var(--danger)';
      res.innerText = `✗ 正解: ${correct}`;
    }
  }

  initThemeGrid();
</script>

</body>
</html>
