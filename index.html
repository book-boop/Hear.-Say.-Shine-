<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hear. Say. Shine!</title>
  <style>
    :root {
      --primary-color: #4A90E2;
      --accent-color: #FFB300;
      --bg-color: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-main: #2D3748;
      --text-muted: #718096;
      --success: #38A169;
      --danger: #E53E3E;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; }

    .app-container {
      width: 100%;
      max-width: 820px;
      min-height: 90vh;
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      margin: 20px;
      padding: 30px;
    }

    /* 頁面切換控制 */
    .view-screen { display: none; flex-direction: column; width: 100%; height: 100%; flex: 1; align-items: center; }
    .view-screen.active { display: flex; }

    /* 標題設計 (弧形效果) */
    .curved-header { text-align: center; margin-bottom: 25px; position: relative; width: 100%; }
    .curved-header h1 {
      font-size: 2.2rem;
      letter-spacing: 2px;
      color: #1A365D;
      display: inline-block;
      position: relative;
      padding: 0 25px;
    }
    .curved-header h1::before {
      content: "(";
      position: absolute;
      left: 0;
      font-weight: 300;
      color: var(--text-muted);
    }
    .curved-header h1::after {
      content: ")";
      position: absolute;
      right: 0;
      font-weight: 300;
      color: var(--text-muted);
    }
    .header-curve-line {
      width: 220px;
      height: 14px;
      border: solid 2.5px #A0AEC0;
      border-color: #A0AEC0 transparent transparent transparent;
      border-radius: 50%/12px 12px 0 0;
      margin: -6px auto 10px auto;
    }

    /* 扉頁：五本書預留區 */
    .books-container {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 40px 0;
      width: 100%;
      flex-wrap: wrap;
    }
    .book-placeholder {
      width: 90px;
      height: 140px;
      border: 2px dashed #CBD5E0;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #A0AEC0;
      font-size: 0.85rem;
      background: #F7FAFC;
    }

    /* 按鈕樣式 */
    .btn-start {
      margin-top: auto;
      padding: 12px 50px;
      font-size: 1.25rem;
      font-weight: bold;
      color: #2D3748;
      background: #FFF;
      border: 2.5px solid #2D3748;
      border-radius: 35px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    .btn-start:hover { background: #2D3748; color: #FFF; transform: translateY(-2px); }

    /* 主題目錄 (3x3 圓圈) */
    .theme-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px 20px;
      width: 100%;
      max-width: 650px;
      margin: 20px auto;
    }
    .circle-theme-btn {
      width: 110px;
      height: 110px;
      margin: 0 auto;
      border-radius: 50%;
      border: 2.5px solid #2D3748;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.8rem;
      font-weight: 600;
      color: #2D3748;
    }
    .circle-theme-btn span.theme-number { font-size: 1.1rem; font-weight: bold; margin-bottom: 2px; }
    .circle-theme-btn:hover { background: #EDF2F7; transform: scale(1.05); }

    /* 答題畫面 */
    .nav-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .back-btn { border: none; background: transparent; font-size: 1rem; color: var(--primary-color); cursor: pointer; font-weight: bold; }
    
    /* 適用範圍資訊框 */
    .scope-box {
      width: 100%;
      background: #EBF8FF;
      border-left: 5px solid var(--primary-color);
      border-radius: 6px;
      padding: 12px 18px;
      margin-bottom: 20px;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .scope-title { font-weight: bold; color: #2B6CB0; margin-bottom: 4px; }
    .scope-detail { color: #4A5568; font-size: 0.88rem; white-space: pre-line; }

    /* Part 頁籤 */
    .part-tabs { display: flex; gap: 10px; width: 100%; margin-bottom: 20px; border-bottom: 2px solid #EDF2F7; padding-bottom: 8px; }
    .tab-btn { background: none; border: none; font-size: 1rem; padding: 6px 14px; cursor: pointer; border-radius: 6px; color: var(--text-muted); font-weight: 600; }
    .tab-btn.active { background: var(--primary-color); color: #FFF; }

    /* 題目區塊 */
    .quiz-body { width: 100%; flex: 1; overflow-y: auto; padding-right: 5px; }
    .question-card { background: #FFF; border: 1px solid #E2E8F0; border-radius: 10px; padding: 15px 18px; margin-bottom: 15px; }
    .question-header { font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .options-group { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
    .option-btn { border: 1.5px solid #CBD5E0; background: #FFF; border-radius: 6px; padding: 6px 16px; cursor: pointer; font-size: 0.95rem; transition: 0.2s; }
    .option-btn:hover { border-color: var(--primary-color); }
    .option-btn.correct { background: var(--success); color: #FFF; border-color: var(--success); }
    .option-btn.wrong { background: var(--danger); color: #FFF; border-color: var(--danger); }

    .input-fill { padding: 6px 10px; border: 1.5px solid #CBD5E0; border-radius: 6px; font-size: 1rem; width: 90px; text-align: center; }
    .btn-audio { background: #EDF2F7; border: 1px solid #CBD5E0; border-radius: 50%; width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
    .loading-text { font-size: 1.1rem; color: var(--text-muted); text-align: center; margin-top: 40px; }
  </style>
</head>
<body>

<div class="app-container">

  <!-- 1. 扉頁 (首頁) -->
  <section id="screen-cover" class="view-screen active">
    <div class="curved-header">
      <h1>Hear. Say. Shine!</h1>
      <div class="header-curve-line"></div>
    </div>

    <!-- 五本書預留區域 -->
    <div class="books-container">
      <div class="book-placeholder">Book 1</div>
      <div class="book-placeholder">Book 2</div>
      <div class="book-placeholder">Book 3</div>
      <div class="book-placeholder">Book 4</div>
      <div class="book-placeholder">Book 5</div>
    </div>

    <button class="btn-start" onclick="navigateTo('screen-menu')">START</button>
  </section>

  <!-- 2. 主題選單頁 (9大主題 3x3 圓圈) -->
  <section id="screen-menu" class="view-screen">
    <div class="curved-header">
      <h1>Hear. Say. Shine!</h1>
      <div class="header-curve-line"></div>
    </div>

    <div class="theme-grid" id="themeGrid"></div>

    <button class="back-btn" style="margin-top: auto;" onclick="navigateTo('screen-cover')">← 回到主頁</button>
  </section>

  <!-- 3. 測驗進行頁 -->
  <section id="screen-quiz" class="view-screen">
    <div class="nav-bar">
      <button class="back-btn" onclick="navigateTo('screen-menu')">← 回主題目錄</button>
      <span id="currentThemeTag" style="font-weight: bold; color: var(--text-muted);"></span>
    </div>

    <!-- 適用範圍提示框 (圖二資訊) -->
    <div class="scope-box" id="scopeContainer">
      <div class="scope-title" id="scopeTitle">適用主題</div>
      <div class="scope-detail" id="scopeDetail">題目範圍載入中...</div>
    </div>

    <!-- Part 頁籤 -->
    <div class="part-tabs">
      <button class="tab-btn active" onclick="switchPart('partA', this)">Part A</button>
      <button class="tab-btn" onclick="switchPart('partB', this)">Part B</button>
      <button class="tab-btn" onclick="switchPart('partC', this)">Part C</button>
    </div>

    <!-- 題目容器 -->
    <div class="quiz-body" id="questionsContainer"></div>
  </section>

</div>

<script>
  // 9 大主題的元資料與檔案對照清單
  const themeList = [
    { id: 1, file: "theme01.json", name: "Alphabets & Sounds", fullTheme: "Alphabets and Letter Sounds", scope: "26個字母\nPhonics FUN Book 1 U1-10\nPhonics GO Book 1 U1-8" },
    { id: 2, file: "theme02.json", name: "Short Vowels", fullTheme: "Short Vowels", scope: "Short Vowels (a, e, i, o, u)\nPhonics FUN Book 1 U13-17\nPhonics GO Book 1 U9-13" },
    { id: 3, file: "theme03.json", name: "Long Vowels", fullTheme: "Long Vowels", scope: "Long Vowels\nPhonics FUN Book 1 U18-19, Book 2 U1-10\nPhonics GO Book 1 U18-19, Book 2 U1-5" },
    { id: 4, file: "theme04.json", name: "More Vowels", fullTheme: "More Vowels", scope: "Diphthongs: oi, oy, ou, ow, oo\nVowel Digraphs: au, aw, al\nGlued Sounds: oll, ull\nPhonics FUN Book 2 U12-14\nPhonics GO Book 2 U12-15" },
    { id: 5, file: "theme05.json", name: "R-Controlled", fullTheme: "R-Controlled Vowels", scope: "ar, or, war, wor, ir, er, ur\nPhonics FUN Book 2 U15-16\nPhonics GO Book 2 U10-11" },
    { id: 6, file: "theme06.json", name: "Blends", fullTheme: "L, R, S Blends", scope: "Blends\nPhonics FUN Book 2 U17, Book 3 U11-12, 15\nPhonics GO Book 1 U14-17" },
    { id: 7, file: "theme07.json", name: "Digraphs", fullTheme: "Consonant Digraphs", scope: "sh, ch, tch, th, gh, wh, ph\nPhonics FUN Book 2 U18-19, Book 3 U7-8\nPhonics GO Book 2 U6-9" },
    { id: 8, file: "theme08.json", name: "Special Consonants", fullTheme: "Special Consonants", scope: "Special Consonants (ck, kn, wr, -mb, -mn, -nd...)\nPhonics FUN Book 3 U8, 9, 13-16\nPhonics GO Book 2 U16-19" },
    { id: 9, file: "theme09.json", name: "Endings & Stress", fullTheme: "Endings, Syllables, Stress", scope: "-s/-es, -ed, 1~3 syllables\nPhonics FUN Book 3 U17-19" }
  ];

  let currentThemeMeta = null;
  let currentThemeData = null;
  let currentPart = 'partA';

  // 畫面切換
  function navigateTo(screenId) {
    document.querySelectorAll('.view-screen').forEach(el => el.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }

  // 建立 3x3 圓形按鈕選單
  function initThemeGrid() {
    const grid = document.getElementById('themeGrid');
    grid.innerHTML = themeList.map(item => `
      <div class="circle-theme-btn" onclick="loadAndOpenTheme(${item.id})">
        <span class="theme-number">U${item.id}</span>
        <span>${item.name}</span>
      </div>
    `).join('');
  }

  // 動態 fetch 當前主題的 json 檔案
  async function loadAndOpenTheme(themeId) {
    currentThemeMeta = themeList.find(t => t.id === themeId);
    document.getElementById('currentThemeTag').innerText = `主題 ${currentThemeMeta.id}`;
    
    // 渲染範圍資訊
    document.getElementById('scopeTitle').innerText = `適用主題：${currentThemeMeta.fullTheme}`;
    document.getElementById('scopeDetail').innerText = currentThemeMeta.scope;
    
    // 顯示載入狀態
    const container = document.getElementById('questionsContainer');
    container.innerHTML = `<div class="loading-text">正在載入 ${currentThemeMeta.file}...</div>`;
    navigateTo('screen-quiz');

    try {
      // 直接向同目錄抓取對應的 theme0X.json
      const response = await fetch(`./${currentThemeMeta.file}`);
      if (!response.ok) throw new Error('檔案讀取失敗');
      currentThemeData = await response.json();
      
      // 預設切換至 Part A
      switchPart('partA', document.querySelector('.tab-btn'));
    } catch (err) {
      container.innerHTML = `<div class="loading-text" style="color:var(--danger)">載入 ${currentThemeMeta.file} 失敗，請確認檔案是否存在於根目錄。</div>`;
      console.error(err);
    }
  }

  // 切換 Part A / B / C
  function switchPart(partKey, btn) {
    currentPart = partKey;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    if(btn) btn.classList.add('active');
    renderQuestions();
  }

  // 瀏覽器語音發音 (TTS)
  function playAudio(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.85;
      window.speechSynthesis.speak(utterance);
    }
  }

  // 渲染試題內容
  function renderQuestions() {
    if (!currentThemeData) return;
    const container = document.getElementById('questionsContainer');
    const questions = currentThemeData[currentPart] || [];

    if (questions.length === 0) {
      container.innerHTML = `<p style="color:#A0AEC0; text-align:center; padding:30px;">該大題無題目</p>`;
      return;
    }

    if (currentPart === 'partA') {
      container.innerHTML = questions.map((q, idx) => `
        <div class="question-card">
          <div class="question-header">
            ${idx + 1}. ${q.question || '請選出正確發音或選項'}
            ${q.audioScript ? `<button class="btn-audio" onclick="playAudio('${q.audioScript}')">🔊</button>` : ''}
          </div>
          <div class="options-group">
            ${q.options.map(opt => `
              <button class="option-btn" onclick="checkChoice(this, '${opt}', '${q.answer}')">${opt}</button>
            `).join('')}
          </div>
        </div>
      `).join('');
    } else if (currentPart === 'partB') {
      container.innerHTML = questions.map((q, idx) => `
        <div class="question-card">
          <div class="question-header">
            ${idx + 1}. ${q.prompt} 
            ${q.hint ? `<span style="color:#718096; font-size:0.9rem;">(${q.hint})</span>` : ''}
          </div>
          <div style="display:flex; gap:10px; align-items:center;">
            <input type="text" class="input-fill" placeholder="填寫字母" id="fill_${idx}">
            <button class="option-btn" onclick="checkFill(${idx}, '${q.answer}')">檢查</button>
            <span id="fill_res_${idx}" style="font-weight:bold; font-size:0.9rem;"></span>
          </div>
        </div>
      `).join('');
    } else if (currentPart === 'partC') {
      container.innerHTML = questions.map((q, idx) => `
        <div class="question-card">
          <div class="question-header">
            ${idx + 1}. 仔細聽發音並選出正確單字：
            ${q.audioScript ? `<button class="btn-audio" onclick="playAudio('${q.audioScript}')">🔊</button>` : ''}
          </div>
          <div class="options-group">
            ${q.options.map(opt => `
              <button class="option-btn" onclick="checkChoice(this, '${opt}', '${q.answer}')">${opt}</button>
            `).join('')}
          </div>
        </div>
      `).join('');
    }
  }

  // 選擇題判斷
  function checkChoice(btn, selected, correct) {
    const parent = btn.parentElement;
    parent.querySelectorAll('.option-btn').forEach(b => b.classList.remove('correct', 'wrong'));
    if (selected === correct) {
      btn.classList.add('correct');
    } else {
      btn.classList.add('wrong');
    }
  }

  // 填空題判斷
  function checkFill(idx, correct) {
    const input = document.getElementById(`fill_${idx}`);
    const res = document.getElementById(`fill_res_${idx}`);
    const val = input.value.trim().toLowerCase();
    const expected = correct.trim().toLowerCase();
    if (val === expected) {
      res.style.color = 'var(--success)';
      res.innerText = '✓ 正確';
    } else {
      res.style.color = 'var(--danger)';
      res.innerText = `✗ 正解: ${correct}`;
    }
  }

  // 畫面載入初始化
  initThemeGrid();
</script>

</body>
</html>
